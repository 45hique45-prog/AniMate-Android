plugins { id 'com.android.application' }

android {
    namespace 'com.animate.companion'
    compileSdk 35

    defaultConfig {
        applicationId 'com.animate.companion'
        minSdk 23
        targetSdk 32
        versionCode 4
        versionName '1.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
